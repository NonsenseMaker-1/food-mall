<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[가게 이름]</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="img/banner1.jpg" />
</head>
<body data-page="home">
  <div id="site-header"></div>
  <section class="hero">
    <img id="img-hero" src="img/banner1.jpg" alt="" fetchpriority="high" decoding="async">
    <div class="hero-copy">
      <em id="since">SINCE [설립연도]</em>
      <h1 id="slogan">[슬로건]</h1>
      <p id="lead">[메인 소개 문구]</p>
    </div>
    <a class="scroll-hint" href="#company">소개 보기</a>
  </section>

  <section class="facts">
    <div class="wrap facts-grid" id="facts"></div>
  </section>

  <section class="sec alt" id="company">
    <div class="wrap about-grid">
      <img id="img-company" src="img/banner2.jpg" alt="" loading="lazy" decoding="async">
      <div>
        <div class="en">BRAND</div>
        <h2>회사소개</h2>
        <p id="story"></p>
        <p class="ceo" id="ceo-line"></p>
        <p><a class="btn" href="about.html">자세히 보기</a></p>
      </div>
    </div>
    <div class="wrap">
      <div class="values" id="values"></div>
    </div>
  </section>

  <section class="sec" id="products">
    <div class="wrap">
      <div class="en reveal">PRODUCT</div>
      <h2 class="reveal">제품소개</h2>
      <div class="grid-3" id="home-products"></div>
      <p class="sec-more reveal"><a class="btn ghost" href="products.html">전체 제품 보기</a></p>
    </div>
  </section>

  <section class="sec alt" id="contact">
    <div class="wrap contact-grid">
      <form class="form" onsubmit="alert('문의 발송 연동 전입니다.');return false;">
        <div class="en">CONTACT</div>
        <h2>문의하기</h2>
        <ol class="steps">
          <li><b>01</b><span>[문의 접수]</span></li>
          <li><b>02</b><span>[상담·안내]</span></li>
          <li><b>03</b><span>[견적·회신]</span></li>
        </ol>
        <div class="field"><label>이름</label><input placeholder="[이름]"></div>
        <div class="field"><label>연락처</label><input placeholder="[연락처]"></div>
        <div class="field"><label>내용</label><textarea rows="5" placeholder="[문의 내용]"></textarea></div>
        <button class="btn" type="submit">보내기</button>
      </form>
      <aside class="panel">
        <div class="en">INFO</div>
        <h2>연락처</h2>
        <p>전화 <b id="c-phone"></b></p>
        <p>이메일 <b id="c-email"></b></p>
        <p>주소 <b id="c-addr"></b></p>
        <p>운영 <b id="c-hours"></b></p>
      </aside>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/notice.js"></script>
  <script src="js/notice-store.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
